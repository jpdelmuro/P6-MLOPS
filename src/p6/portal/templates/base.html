<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>P6 - Centro de monitoreo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f1115; color: #e6e6e6; }
    a { color: #8ab4f8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav a { margin-right: 1.2rem; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #333; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.85rem; }
    th { background: #1b1e26; }
    tr:nth-child(even) { background: #14161b; }
    .zona-aceptada { color: #7CFC9A; }
    .zona-duda { color: #FFD166; }
    .zona-baja_confianza { color: #FF6B6B; font-weight: 600; }
    .zona-sin_puntuacion { color: #999; }
    form { margin-top: 0.75rem; }
    label { margin-right: 1rem; }
    select { background: #1b1e26; color: #e6e6e6; border: 1px solid #333; padding: 0.2rem; }
    .vacio { color: #999; font-style: italic; margin-top: 1rem; }
    .aviso { background: #3a2a10; border: 1px solid #a06a1a; color: #ffcc80; border-radius: 6px; padding: 0.6rem 1rem; margin-top: 1rem; }
    .comparar-col { font-weight: 700; }
    .comparar-destaca { color: #FF6B6B; font-weight: 700; }
    .tarjetas { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    .tarjeta { background: #1b1e26; border: 1px solid #333; border-radius: 6px; padding: 0.8rem 1.2rem; min-width: 180px; }
    .tarjeta h3 { margin: 0 0 0.3rem; font-size: 0.8rem; color: #999; font-weight: 600; text-transform: uppercase; }
    .tarjeta .valor { font-size: 1.4rem; font-weight: 700; }
    .hist-fila { display: flex; align-items: center; gap: 0.6rem; margin: 0.2rem 0; font-size: 0.85rem; }
    .hist-etiqueta { width: 7rem; }
    .hist-barra-fondo { flex: 1; background: #1b1e26; border-radius: 3px; overflow: hidden; height: 1rem; }
    .hist-barra { background: #8ab4f8; height: 100%; }
    .hist-conteo { width: 2.5rem; text-align: right; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Inicio</a>
    <a href="/eventos">Eventos</a>
    <a href="/alertas">Alertas</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/comparar">Comparar</a>
  </nav>
  <h1>{{ titulo }}</h1>
  {% block contenido %}{% endblock %}
</body>
</html>
